<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky-d3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C84B6B"/>
      <stop offset="1" stop-color="#7a2c43"/>
    </linearGradient>
    <radialGradient id="glow-d3" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd0dc" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ffd0dc" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sky-d3)"/>
  <ellipse cx="400" cy="300" rx="400" ry="240" fill="url(#glow-d3)"/>

  <!-- Circuit board paths -->
  <g stroke="#fff8e0" stroke-width="2" fill="none" opacity="0.7" stroke-linecap="round" stroke-linejoin="round">
    <!-- Horizontal traces -->
    <path d="M 60 120 L 200 120 L 220 140 L 360 140 L 380 120 L 540 120"/>
    <path d="M 60 200 L 140 200 L 160 220 L 300 220 L 320 240 L 460 240 L 480 220 L 620 220 L 640 240 L 740 240"/>
    <path d="M 60 380 L 180 380 L 200 360 L 340 360 L 360 380 L 500 380 L 520 360 L 660 360 L 680 380 L 740 380"/>
    <path d="M 60 460 L 220 460 L 240 480 L 380 480 L 400 460 L 540 460 L 560 480 L 740 480"/>
    <!-- Vertical bridges -->
    <path d="M 200 120 L 200 200"/>
    <path d="M 540 120 L 540 240"/>
    <path d="M 320 240 L 320 360"/>
    <path d="M 660 360 L 660 460"/>
  </g>

  <!-- Data nodes / chips -->
  <g>
    <!-- Central CPU -->
    <rect x="340" y="270" width="120" height="80" rx="6" fill="none" stroke="#fff8e0" stroke-width="2.5" opacity="0.9"/>
    <rect x="356" y="286" width="88" height="48" rx="3" fill="#fff8e0" opacity="0.18"/>
    <text x="400" y="320" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600" fill="#fff8e0" text-anchor="middle" letter-spacing="2">AI</text>
    <!-- CPU pins -->
    <g stroke="#fff8e0" stroke-width="2" opacity="0.7">
      <line x1="350" y1="270" x2="350" y2="260"/>
      <line x1="370" y1="270" x2="370" y2="260"/>
      <line x1="390" y1="270" x2="390" y2="260"/>
      <line x1="410" y1="270" x2="410" y2="260"/>
      <line x1="430" y1="270" x2="430" y2="260"/>
      <line x1="450" y1="270" x2="450" y2="260"/>
      <line x1="350" y1="350" x2="350" y2="360"/>
      <line x1="370" y1="350" x2="370" y2="360"/>
      <line x1="390" y1="350" x2="390" y2="360"/>
      <line x1="410" y1="350" x2="410" y2="360"/>
      <line x1="430" y1="350" x2="430" y2="360"/>
      <line x1="450" y1="350" x2="450" y2="360"/>
    </g>
  </g>

  <!-- Smaller chips -->
  <g>
    <rect x="120" y="160" width="50" height="32" rx="3" fill="#fff8e0" opacity="0.25" stroke="#fff8e0" stroke-width="1.5"/>
    <rect x="600" y="180" width="60" height="28" rx="3" fill="#fff8e0" opacity="0.25" stroke="#fff8e0" stroke-width="1.5"/>
    <rect x="240" y="420" width="50" height="32" rx="3" fill="#fff8e0" opacity="0.25" stroke="#fff8e0" stroke-width="1.5"/>
    <rect x="600" y="420" width="50" height="32" rx="3" fill="#fff8e0" opacity="0.25" stroke="#fff8e0" stroke-width="1.5"/>
  </g>

  <!-- Bright nodes -->
  <g fill="#fff8e0">
    <circle cx="200" cy="120" r="4"/>
    <circle cx="540" cy="120" r="4"/>
    <circle cx="320" cy="240" r="4"/>
    <circle cx="480" cy="240" r="4"/>
    <circle cx="200" cy="380" r="4"/>
    <circle cx="660" cy="360" r="4"/>
    <circle cx="540" cy="460" r="4"/>
  </g>

  <!-- Binary/code accents -->
  <g font-family="JetBrains Mono, monospace" font-size="10" fill="#fff8e0" opacity="0.4">
    <text x="60" y="80">01101001 01101110</text>
    <text x="540" y="540">11000010 10110100</text>
  </g>
</svg>
