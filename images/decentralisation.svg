<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky-d2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E74B5"/>
      <stop offset="1" stop-color="#1a4a7a"/>
    </linearGradient>
    <radialGradient id="glow-d2" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a6d1ff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#a6d1ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sky-d2)"/>
  <!-- Soft glow -->
  <ellipse cx="400" cy="300" rx="380" ry="280" fill="url(#glow-d2)"/>

  <!-- Network connections -->
  <g stroke="#a6d1ff" stroke-width="1.5" stroke-dasharray="3 4" fill="none" opacity="0.7">
    <line x1="160" y1="180" x2="400" y2="300"/>
    <line x1="640" y1="160" x2="400" y2="300"/>
    <line x1="120" y1="420" x2="400" y2="300"/>
    <line x1="680" y1="440" x2="400" y2="300"/>
    <line x1="400" y1="120" x2="400" y2="300"/>
    <line x1="400" y1="480" x2="400" y2="300"/>
    <!-- Outer cross-links -->
    <line x1="160" y1="180" x2="400" y2="120"/>
    <line x1="400" y1="120" x2="640" y2="160"/>
    <line x1="160" y1="180" x2="120" y2="420"/>
    <line x1="640" y1="160" x2="680" y2="440"/>
    <line x1="120" y1="420" x2="400" y2="480"/>
    <line x1="400" y1="480" x2="680" y2="440"/>
  </g>

  <!-- House icons at nodes -->
  <g fill="#fff8e0" stroke="none">
    <!-- Center hub (larger) -->
    <circle cx="400" cy="300" r="44" fill="#fff8e0" opacity="0.9"/>
    <circle cx="400" cy="300" r="58" fill="none" stroke="#fff8e0" stroke-width="2" opacity="0.4"/>
    <g transform="translate(400 300)" fill="#2E74B5">
      <path d="M -16 4 L 0 -14 L 16 4 L 16 16 L -16 16 Z"/>
      <rect x="-4" y="6" width="8" height="10"/>
    </g>
  </g>

  <!-- Outer house nodes -->
  <g>
    <g transform="translate(160 180)">
      <circle r="22" fill="#fff8e0" opacity="0.85"/>
      <g fill="#2E74B5">
        <path d="M -10 2 L 0 -8 L 10 2 L 10 10 L -10 10 Z"/>
      </g>
    </g>
    <g transform="translate(640 160)">
      <circle r="22" fill="#fff8e0" opacity="0.85"/>
      <g fill="#2E74B5">
        <path d="M -10 2 L 0 -8 L 10 2 L 10 10 L -10 10 Z"/>
      </g>
    </g>
    <g transform="translate(400 120)">
      <circle r="22" fill="#fff8e0" opacity="0.85"/>
      <g fill="#2E74B5">
        <path d="M -10 2 L 0 -8 L 10 2 L 10 10 L -10 10 Z"/>
      </g>
    </g>
    <g transform="translate(120 420)">
      <circle r="22" fill="#fff8e0" opacity="0.85"/>
      <g fill="#2E74B5">
        <path d="M -10 2 L 0 -8 L 10 2 L 10 10 L -10 10 Z"/>
      </g>
    </g>
    <g transform="translate(680 440)">
      <circle r="22" fill="#fff8e0" opacity="0.85"/>
      <g fill="#2E74B5">
        <path d="M -10 2 L 0 -8 L 10 2 L 10 10 L -10 10 Z"/>
      </g>
    </g>
    <g transform="translate(400 480)">
      <circle r="22" fill="#fff8e0" opacity="0.85"/>
      <g fill="#2E74B5">
        <path d="M -10 2 L 0 -8 L 10 2 L 10 10 L -10 10 Z"/>
      </g>
    </g>
  </g>

  <!-- Animated pulse dots on the lines -->
  <g fill="#fff8e0">
    <circle cx="280" cy="240" r="3" opacity="0.8"/>
    <circle cx="520" cy="230" r="3" opacity="0.8"/>
    <circle cx="260" cy="360" r="3" opacity="0.8"/>
    <circle cx="540" cy="370" r="3" opacity="0.8"/>
  </g>
</svg>
